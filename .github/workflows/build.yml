name: Build Rain Bundle
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: node scripts/build.mjs --release-branch=main --build-bytecode
      - name: Publish Bundle to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            dist/*.js
            dist/*.hbc
          fail_on_unmatched_files: false
